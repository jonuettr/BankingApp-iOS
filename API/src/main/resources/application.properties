spring.application.name=banking-api
spring.datasource.url=jdbc:mysql://localhost:3306/banking_app?useSSL=false&serverTimezone=America/Mexico_City
spring.datasource.username=banking_app_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# El secreto JWT nunca se escribe directamente en el proyecto.
# Spring lo obtiene de la variable de entorno JWT_SECRET.
security.jwt.secret=${JWT_SECRET}

# Duración del token: 1 hora = 3,600,000 milisegundos.
security.jwt.expiration-ms=3600000
